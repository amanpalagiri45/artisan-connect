services:
  - type: web
    name: artisan-connect-api
    rootDir: backend
    env: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./artisan_connect.db
  - type: web
    name: artisan-connect-web
    rootDir: frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://artisan-connect-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
